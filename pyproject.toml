[project]
name = "llmguard"
version = "0.1.0"
description = "Prompt-injection and jailbreak scoring lab for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zubayr Uralov", url = "https://github.com/uralovzubayr5-crypto" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "owasp"]

[project.scripts]
llmguard = "llmguard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llmguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
